<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0f1115" />
    </radialGradient>

    <!-- Glowing Circle Gradient -->
    <linearGradient id="circle-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Circles -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />

  <!-- Logo Group -->
  <g filter="url(#glow)" stroke="url(#circle-grad)" stroke-width="16" fill="none" stroke-linecap="round">
    <!-- Bottom Circle -->
    <circle cx="160" cy="352" r="80" stroke-opacity="0.85" />
    
    <!-- Middle Circle -->
    <circle cx="256" cy="256" r="80" stroke-opacity="0.95" />
    
    <!-- Top Circle -->
    <circle cx="352" cy="160" r="80" stroke-opacity="1.0" />
  </g>
</svg>
